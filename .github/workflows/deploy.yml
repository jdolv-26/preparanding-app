name: test → deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # runtimes + verificación ref/wrong/starter + bundle + escaneo de dist
      - run: npm run build
        env: { BASE: /preparanding-app/ }
      - run: npx playwright install --with-deps chromium webkit
      - run: npx vite build && npx playwright test
        env: { BASE: / }
      - run: npx vite build
        env: { BASE: /preparanding-app/ }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
